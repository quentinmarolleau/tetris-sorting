[project]
name = "tetris-sorting"
version = "1.0.0"
description = "The Tetris rearrangement algorithm of Wang et al. 2023 for optical tweezer arrays, with its success-rate and rearrangement-cost benchmarks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quentin Marolleau" }]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "rich>=15.0.0",
]

[project.urls]
"Blog post" = "https://marolleau.me/posts/tetris-sorting/"
Repository = "https://github.com/quentinmarolleau/tetris-sorting"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tetris"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests share helpers as `tests.<module>`, which needs the repository root
# on the path; `tests/` has no __init__.py
pythonpath = ["."]

[tool.coverage.run]
source = ["tetris"]
concurrency = ["multiprocessing"]
sigterm = true
parallel = true

[tool.basedpyright]
include = ["tetris", "tests"]
venvPath = "."
venv = ".venv"
# "standard" catches real type errors; basedpyright's default "recommended"
# adds a warning for every value numpy, pandas and matplotlib leave untyped
typeCheckingMode = "standard"
